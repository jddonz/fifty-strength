<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Privacy-first 8-week strength and CrossFit foundation workout app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>Fifty Strength</title>
</head>
<body>
<header class="app-header">
  <div><div class="eyebrow">8-WEEK FOUNDATION</div><h1>Fifty Strength</h1></div>
  <button id="installBtn" class="secondary hidden">Install</button>
</header>
<nav class="tabs" aria-label="Main navigation">
  <button class="tab active" data-view="today">Today</button>
  <button class="tab" data-view="program">Program</button>
  <button class="tab" data-view="progress">Progress</button>
</nav>
<main id="app" class="container"></main>
<footer>Local-first · No account · No workout data leaves this device</footer>
<script src="app.js?v=3" defer></script>
<script defer>
  // One-time migration for the early preview builds. The original v1 service
  // worker used cache-first behavior and can otherwise keep stale app.js alive.
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) {
          registration.unregister().catch(function () {});
        });
      }).catch(function () {});
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (key.indexOf('fifty-strength-') === 0) caches.delete(key);
          });
        }).catch(function () {});
      }
    }, 500);
  });
</script>
</body>
</html>
